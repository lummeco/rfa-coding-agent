# Workspace settings. Anything at the top level applies to every stage; a `planner:`, `coder:` or
# `reviewer:` block applies to that one only. See src/rfa/settings.py.

# The repositories tasks may name in their `repos:` front matter, mapped to local checkouts.
# The last segment is the name the packet and the container use: `lummepro-web/src/...`.
# Everything is pinned to `@main` on purpose: a run must not depend on what you happen to have
# checked out. Change the ref here, or per task, when work should start somewhere else.
repos:
  lummeco/lummepro-web: ~/dev/lummepro-web@main
  lummeco/customer-app: ~/dev/customer-app@main
  lummeco/customer-portal: ~/dev/customer-portal@main
  lummeco/deliveryPlanner: ~/dev/delivery-planner@main
  lummeco/esignature-service: ~/dev/esignature-service@main
  lummeco/pricing-calculator: ~/dev/pricing-calculator@main
  lummeco/lummecofi: ~/dev/lummecofi@main
  lummeco/base: ~/dev/base@main
  lummeco/infra-ops: ~/dev/infra-ops@main
  lummeco/rfa-coding-agent: ~/dev/rfa-coding-agent@main

# The apps the reviewer may drive. A repository listed here gets a third stage: once the coder's
# work lands, a container comes up at that branch with playwright in it, `setup:` runs, `serve:` is
# left running, and the reviewer clicks through the app against the packet's acceptance criteria.
# Work that does not do what was asked goes back to `todo` on its own, with the reason under it.
#
# A repository with no entry here is done when the coder is done -- which is what makes this opt-in.
#
#   setup:   commands run once in the repository before the app starts. 900s each.
#   serve:   the command left running. It must stay in the foreground.
#   port:    what `serve` listens on, inside the container. Waited for before the agent starts.
#   path:    appended to the base URL; default `/`.
#   ready:   seconds to wait for the port. Default 120.
apps:
  lummeco/rfa-coding-agent:
    setup:
      # Its own environment, so the app's dependencies cannot collide with the playwright the
      # reviewer's own scripts import. `virtualenv` rather than `python -m venv`: the review image's
      # python is apt's, which ships without ensurepip, and virtualenv is already in that image.
      - virtualenv --quiet /tmp/app
      - /tmp/app/bin/pip install --quiet -e .
      # A board with nothing on it shows nothing. The workspace is the repo copy itself; the tasks
      # created here are that copy's, and nothing touches yours.
      - /tmp/app/bin/python -m rfa init
      - /tmp/app/bin/python -m rfa new "a first idea to look at"
      - /tmp/app/bin/python -m rfa new "a second idea to look at"
    # `-u`, because the address and this start's token are printed and a redirected stdout would
    # hold them in a buffer until the board stops -- which is exactly when they stop being useful.
    serve: /tmp/app/bin/python -u -m rfa board --no-open --host 127.0.0.1 --port 4380
    port: 4380
    ready: 90

# Pull requests. The board's Create PR button pushes the landed branch and opens the PR through the
# GitHub API with a fine-grained PAT -- repository access: only the repos above; permissions:
# Contents and Pull requests, read and write; nothing else -- kept in the login Keychain:
#   security add-generic-password -s rfa-github-pat -a rfa -w
# `gh` is not used and does not need to be logged in.
github:
  keychain_service: rfa-github-pat

# Sentry. With this block here the daemon asks each project under `projects:` for the issues `query`
# matches -- unresolved ones seen this week, by default -- every `interval` seconds,
# and captures each one it has not seen before as a draft naming the repository the project maps to.
# A draft and nothing further:
# it lands in front of you exactly as an idea typed into the capture box would, with the exception,
# the culprit and the in-app frames of the latest event under it, because the planner's container
# has no network to fetch them with. `rfa sentry` is the same look, now. See src/rfa/sentry.py.
#
# Read with an organization auth token -- Issue & Event: Read, nothing else -- kept in the login
# Keychain like the GitHub one:
#   security add-generic-password -s rfa-sentry-token -a rfa -w

sentry:
  org: lummeco
  interval: 1800
  # Sentry's own search syntax; the window is the `lastSeen:` part. Unresolved, seen this week.
  query: "is:unresolved lastSeen:-7d"
  keychain_service: rfa-sentry-token
  # Sentry project slug: the repository its issues belong to, as listed under `repos:`. The slug is
  # the project's name in Sentry's own URLs; a project not listed here is never asked about.
  projects:
    lummepro-web: lummeco/lummepro-web
    customer-app: lummeco/customer-app
    lummeco-base: lummeco/base

# The models a run may use, by the name you type: `rfa work -m qwen3.8`, `rfa model qwen3.6`.
#
# Each one is served as its own Ollama variant, because Ollama gives a model a small default
# context and silently drops the start of anything longer -- and the harness alone is ~17k tokens
# before any work starts. `rfa up` creates whichever variants are missing.
#
# `num_ctx` is also the ceiling the coder watches: past 80% of it every observation tells the coder
# to finish and submit, and a run that fills it anyway stops there rather than spending its last
# calls on a window with no room left in it.
#
# `reasoning` is litellm's reasoning_effort, which becomes Ollama's `think`. Only models with
# graded thinking read the level itself; for a Qwen, `none` turns thinking off and low/medium/high
# all turn it on. Thinking costs context and time, so the planner wants it and a long coding run
# often does not.
models:
  qwen3.6:
    model_name: ollama_chat/rfa-qwen3.6-35b
    ollama: {name: rfa-qwen3.6-35b, from: qwen3.6:35b-a3b-q8_0, num_ctx: 131072}
    reasoning: high
  qwen3.8:
    model_name: ollama_chat/rfa-qwen3.8
    ollama: {name: rfa-qwen3.8, from: qwen3.8:latest, num_ctx: 131072}
    reasoning: medium

# What a run uses when nothing else said. A `planner:`/`coder:` block may set its own; `rfa model
# <name>` and `-m` on a command override both, and a card's own `model:` overrides the default.
default_model: qwen3.8

# Applies to every model above: Ollama models are not in litellm's price registry, and a missing
# price is not a reason to stop.
#
# `keep_alive` is how long Ollama holds the model in memory after a call. Its default is 5 minutes,
# which is shorter than a single coder step may run (`timeout: 600`), so the model is evicted mid-run
# and every reload pays the load cost again -- on a big model at 131072 context that is what a run
# sees as a timeout. Holding it past the longest step means one load per run instead of one per step.
# The cost is memory held while nothing is running, which `daemon.memory_min_pct` then counts against
# starting the next card.
model:
  cost_tracking: ignore_errors
  model_kwargs:
    keep_alive: 20m

coder:
  environment:
    image: node:22-bookworm

# What the coder's container needs per repository, keyed like `repos:` and read off a task's first
# repository. The host runs `setup:` in the repository root before the coder starts and before the
# base commit, so the packet's checks can run at all: a coder that has to install its own dependencies
# and start its own database spends its budget on that instead -- and with no `containers:` block the
# checks were red before it started, which now stops the run at step 0 rather than at step 120.
#
#   image:  the coder's image for this repository; default is `coder.environment.image`.
#   setup:  commands run once in the repository root. 900s each; a failure puts the card back in todo.
#   env:    variables set on every command, the coder's and the checks'.
#   test:   the repository's own test suite, run by the host -- never the coder -- before the coder
#           starts and on every submit. It must write a JUnit report to `$RFA_JUNIT`, e.g.
#           `pytest -q --junitxml=$RFA_JUNIT`. A test that passed before, or one the coder added,
#           failing sends the work back to the coder; the board marks every test in the diff.
#   lint:   the repository's own linter over the whole repository, run by the host like `test:`. With
#           ruff's `--output-format json` it is judged problem by problem: only a problem that was not
#           there before the coder started counts. Any other output is judged by exit code alone.
#
# With a `test:` or a `lint:`, those are the gate and the packet's own commands are only suggestions
# to the coder: the planner writes them without being able to run them.
containers:
  lummeco/base:
    image: python:3.11-bookworm
    setup:
      # Postgres with PostGIS, in the container, started once: a service started in one command is
      # still running in the next. `tests/conftest.py` connects as test/test to `test` on 127.0.0.1.
      - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends postgresql postgresql-15-postgis-3 > /dev/null
      - service postgresql start
      - su postgres -c "psql -qc \"CREATE USER test WITH PASSWORD 'test' SUPERUSER\"" && su postgres -c "psql -qc 'CREATE DATABASE test OWNER test'"
      # What lummeco-base/Dockerfile does for the dev image: the locked dependency set, dev group included.
      - cd lummeco-base && pip install --quiet poetry poetry-plugin-export && poetry export --without-hashes --with dev -o /tmp/requirements.txt && pip install --quiet -r /tmp/requirements.txt && pip install --quiet --force-reinstall --no-deps jwt==1.3.1
    # `make lint` without the docker compose around it.
    lint: cd lummeco-base && ruff check --output-format json src
    # `make test` without the docker compose around it or the coverage: the whole suite, from the
    # package root so `import src.*` and tests/conftest.py's defaults for the Postgres above apply.
    test: cd lummeco-base && python -m pytest tests/ -q --junitxml=$RFA_JUNIT
  lummeco/rfa-coding-agent:
    # Python, not the stage's node image: the package wants >=3.10 and pip. git ships in this image,
    # and the tests make their own repositories with it.
    image: python:3.11-bookworm
    env:
      # litellm fetches its price map from GitHub on import unless told to use the bundled one.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      MSWEA_CONFIGURED: "true"
    setup:
      - pip install --quiet -e '.[dev]'
    lint: ruff check --output-format json src/rfa tests/rfa
    # rfa's own suite. The rest of `tests/` is mini-swe-agent's, and CI runs it with podman,
    # apptainer and API keys a coder container does not have.
    test: python -m pytest tests/rfa -q -p no:cacheprovider --junitxml=$RFA_JUNIT

# The daemon `rfa up` leaves running: it plans cards waiting in `planning` and codes cards you
# approved into `todo`, one at a time, and only while this Mac can take it. It never moves a packet
# from planning to todo -- that gate is yours. See src/rfa/daemon.py.
daemon:
  interval: 15
  # On battery: nothing starts below this, or at all with `require_power: true`. Low Power Mode
  # closes the gate whatever the charge, and wall power opens it whatever the charge.
  battery_min: 50
  require_power: false
  # Free memory a run needs. Memory pressure above normal closes the gate whatever this says.
  memory_min_pct: 30
  keep_awake: true
  # Stop planning once this many cards of work are waiting for you or for the coder: past that the
  # coder is the bottleneck and another packet would only queue behind it.
  plan_ahead: 2
  max_attempts: 3
  error_backoff: 300
