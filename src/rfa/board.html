// The daemon is a separate process; without this the board shows a card sitting in `todo` and
// gives you no way to tell "nothing is running it" from "it is holding until you plug the Mac in".
// One line, one dot, one message: what the daemon is doing right now, and why it is not when it is not.
const STATIONS = ["Idea", "Plan", "Tests", "Code", "Review", "You"];
const AT = { planning: 1, "writing-tests": 2, reviewing: 4 };
const JOB_AT = { plan: 1, tests: 2, work: 3, review: 4 };
const VERB = ["", "Planning", "Writing tests for", "Coding", "Reviewing"];
const PASSED = ["built", "shipped"];
const passed = p => p.stage === "done" && PASSED.includes(p.status);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const byCreated = (a, b) => String(a.created).localeCompare(String(b.created));

/** Everything that waits on you, most blocking first: an unanswered question holds the line. */
function turnItems() {
  const live = state.tasks.filter(t => !t.archived);
  return [
    ["answer", "Answer", t => t.status === "question"],
    ["failed", "Failed", t => t.status === "failed"],
    ["approve", "Approve plan", t => t.stage === "planning" && t.status === "ready"],
    ["judge", "Judge", t => t.stage === "done" && !t.verdict && t.status !== "failed" && !t.parent],
  ].flatMap(([kind, label, test]) => live.filter(test).sort(byCreated).map(t => ({ kind, label, t })));
}

const partOf = t => {
  const owner = t.parent && state.tasks.find(x => x.id === t.parent);
  return owner ? ` · part ${t.part} of ${owner.parts.length} of ${owner.title}` : "";
};

// --- the orb: the machine's state as a ball of dots, read before any word on the page ----------

// Dots in rows of latitude: a row is what turns, scans or lights up. The cube has dots of its own,
// a grid on each face, so its faces read as faces.
const ORB_ROWS = 11, GRID = [-0.48, -0.24, 0, 0.24, 0.48], orbDots = [], cubeDots = [];
for (let r = 0; r < ORB_ROWS; r++) {
  const lat = (-75 + 150 * r / (ORB_ROWS - 1)) * Math.PI / 180, n = Math.max(4, Math.round(24 * Math.cos(lat)));
  for (let i = 0; i < n; i++) orbDots.push({ r, lat, a: 2 * Math.PI * i / n });
}
for (let axis = 0; axis < 3; axis++) for (const side of [-1, 1]) for (const u of GRID) for (const v of GRID) {
  const p = [0, 0, 0], n = [0, 0, 0];
  p[axis] = 0.6 * side; p[(axis + 1) % 3] = u; p[(axis + 2) % 3] = v; n[axis] = side;
  cubeDots.push({ p, n });
}
// mode: idle | blocked | planning | tests | coding | reviewing | waiting. `cube` and `grey` ease
// between 0 and 1, so one state turns into the next instead of cutting to it.
const orb = { mode: "idle", t: 0, yaw: 0.6, pitch: 0, roll: 0, vel: null, rows: new Array(ORB_ROWS).fill(0),
  phase: "spin", pt: 0, twists: 0, tw: null, cube: 0, grey: 1, last: 0 };
const orbStill = matchMedia("(prefers-reduced-motion: reduce)").matches;
const band = tw => [...Array(tw.width)].map((_, i) => tw.start + i);

function orbEndTwist() {
  if (orb.tw) band(orb.tw).forEach(r => orb.rows[r] = orb.tw.from[r] + orb.tw.dir * Math.PI / 2);
  orb.tw = null;
}

function orbStep(dt) {
  const o = orb, k = orbStill ? 1 : Math.min(1, dt * 5);
  o.t += dt;
  o.cube += ((o.mode === "waiting") - o.cube) * k;
  o.grey += ((o.mode === "idle" || o.mode === "blocked") - o.grey) * k;
  if (o.mode === "idle") o.yaw += dt * 0.3;
  if (o.mode === "reviewing") o.yaw += dt * 0.2;
  if (o.mode === "tests") o.yaw += dt * 0.25;
  if (o.mode === "coding") o.rows.forEach((_, r) => o.rows[r] += dt * (r % 2 ? -1 : 1) * (0.5 + 0.35 * (r * 7 % 3)));
  if (o.mode !== "planning") {
    // Out of a tumble, the ball settles upright again.
    const wrap = a => a - 2 * Math.PI * Math.round(a / (2 * Math.PI));
    orbEndTwist();
    Object.assign(o, { phase: "spin", pt: 0, vel: null, pitch: wrap(o.pitch) * (1 - k), roll: wrap(o.roll) * (1 - k) });
    return;
  }
  // Planning: tumble in a new random direction, slow to a stop, then turn four bands of rows a
  // quarter turn each -- drifting a little all the while, so it never looks stalled.
  o.pt += dt;
  if (o.phase === "spin") {
    if (!o.vel) {
      const v = [0, 0, 0].map(() => Math.random() - 0.5), len = Math.hypot(...v) || 1;
      o.vel = v.map(c => c / len * 3.2);
    }
    const speed = Math.sin(Math.PI * Math.min(1, o.pt / 1.8)) * dt;
    o.yaw += o.vel[0] * speed; o.pitch += o.vel[1] * speed; o.roll += o.vel[2] * speed;
    if (o.pt > 1.8) Object.assign(o, { phase: "hold", pt: 0, vel: null });
    return;
  }
  o.yaw += dt * 0.25;
  if (o.phase === "hold" && o.pt <= 1) return;
  if (o.phase === "hold" || o.pt > 0.75) {
    orbEndTwist();
    o.twists = o.phase === "hold" ? 0 : o.twists + 1;
    o.pt = 0;
    if (o.twists >= 4) return void (o.phase = "spin");
    const width = 1 + Math.floor(Math.random() * 3);
    o.phase = "twist";
    o.tw = { width, start: Math.floor(Math.random() * (ORB_ROWS - width + 1)), dir: Math.random() < 0.5 ? -1 : 1, from: o.rows.slice() };
    return;
  }
  const p = Math.min(1, o.pt / 0.55), e = p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;
  band(o.tw).forEach(r => o.rows[r] = o.tw.from[r] + o.tw.dir * Math.PI / 2 * e);
}

function orbDraw(el) {
  const o = orb, size = el.clientWidth, dpr = devicePixelRatio || 1, rad = size * 0.4;
  if (el.width !== Math.round(size * dpr)) el.width = el.height = Math.round(size * dpr);
  const ctx = el.getContext("2d"), ink = getComputedStyle(el).color.match(/\d+/g).slice(0, 3).map(Number);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  const dot = (x, y, r, rgb, alpha) => {
    ctx.fillStyle = `rgba(${rgb},${alpha})`;
    ctx.beginPath();
    ctx.arc(size / 2 + x * rad, size / 2 - y * rad, r, 0, 2 * Math.PI);
    ctx.fill();
  };
  if (o.cube < 0.99) {
    // Blocked strains a little each way and falls back, swelling and fading as it does.
    const blocked = o.mode === "blocked", breath = 0.5 + 0.5 * Math.sin(o.t * 2);
    const yaw = o.yaw + (blocked ? 0.14 * Math.sin(o.t * 2) : 0), tilt = 0.35 + o.pitch;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), ct = Math.cos(tilt), st = Math.sin(tilt), cz = Math.cos(o.roll), sz = Math.sin(o.roll);
    const glow = (blocked ? 0.1 + 0.9 * breath : 1) * (1 - o.cube), swell = blocked ? 0.88 + 0.12 * breath : 1;
    const base = [255, 159, 10].map((c, i) => c + ([142, 142, 147][i] - c) * o.grey);
    const scan = (Math.sin(o.t * 1.4) * 0.5 + 0.5) * (ORB_ROWS - 1);
    const spotX = Math.cos(o.t * 0.9) * 0.5, spotY = Math.sin(o.t * 1.4) * 0.45;
    for (const d of orbDots) {
      const a = d.a + o.rows[d.r], cl = Math.cos(d.lat), x = cl * Math.cos(a), y = Math.sin(d.lat), z = cl * Math.sin(a);
      const x0 = x * cy + z * sy, z1 = -x * sy + z * cy, x1 = x0 * cz - y * sz, y1 = x0 * sz + y * cz;
      const y2 = y1 * ct - z1 * st, z2 = y1 * st + z1 * ct, depth = Math.max(0, Math.min(1, (z2 + 1.1) / 2.2));
      // What is lit: the rows being turned, the band scanning for tests, the spot the reviewer is under.
      const lit = o.tw && band(o.tw).includes(d.r) ? 1
        : o.mode === "tests" ? Math.max(0, 1 - Math.abs(d.r - scan) / 1.6)
        : o.mode === "reviewing" && z2 > 0 ? Math.min(1, Math.max(0, 1 - Math.hypot(x1 - spotX, y2 - spotY) / 0.52) * 1.6) : 0;
      const dim = o.mode === "tests" ? 0.45 + 0.55 * lit : o.mode === "reviewing" ? 0.22 + 0.78 * lit : 1;
      dot(x1 * swell, y2 * swell, (1 + 1.9 * depth) * (1 + (o.mode === "reviewing" ? 1.1 : 0.5) * lit),
        base.map((c, i) => Math.round(c + (ink[i] - c) * lit)), (0.18 + 0.82 * depth) * glow * dim);
    }
  }
  if (o.cube > 0.01) {
    // Waiting on you: a cube balanced on one corner, turning slowly about the upright diagonal.
    // Near dots are larger; a face coming round brightens gradually as it passes edge-on.
    const c45 = Math.SQRT1_2, ct = Math.cos(0.9553), st = Math.sin(0.9553), cs = Math.cos(o.t * 0.45), ss = Math.sin(o.t * 0.45);
    const turn = ([x, y, z]) => {
      const x0 = (x + z) * c45, z1 = (z - x) * c45, y2 = y * ct - z1 * st, z2 = y * st + z1 * ct;
      return [x0 * cs + z2 * ss, y2, -x0 * ss + z2 * cs];
    };
    const seen = cubeDots.map(d => ({ p: turn(d.p), facing: turn(d.n)[2] })).sort((a, b) => a.p[2] - b.p[2]);
    for (const { p, facing } of seen) {
      const near = 0.95 / (1 - p[2] * 0.3), edge = Math.max(0, Math.min(1, (facing + 0.25) / 0.5)), front = edge * edge * (3 - 2 * edge);
      dot(p[0] * near, p[1] * near, (1.5 + front) * near, "255,159,10", (0.1 + front * (0.2 + 0.7 * Math.max(0, facing))) * o.cube);
    }
  }
}

function orbTick(now) {
  const el = document.getElementById("orb");
  orbStep(orbStill ? 0 : Math.min(0.05, (now - orb.last) / 1000));
  orb.last = now;
  if (el?.offsetParent) orbDraw(el);
  requestAnimationFrame(orbTick);
}
requestAnimationFrame(orbTick);

/** What the one machine is on, where that is on the line, and what comes after. Sets the orb's mode. */
// What the machine will do for a card when its turn comes, and what a card in Your move needs from you.
const WILL = { plan: "To be planned", tests: "To have its tests written", work: "To be coded", review: "To be reviewed" };
const NEEDS = { answer: "Needs your answers", failed: "Failed", approve: "Needs your approval", judge: "Needs your verdict" };
const short = repo => repo.split("/").pop();
const will = t => t.scout ? "To read the repo and suggest work" : WILL[t.job];

/** Your line for the desk, in your order: cards the machine has something to do for and is not on now. */
function linedUp() {
  const running = new Set((state.system?.running || []).map(t => t.id));
  return state.tasks.filter(t => Number.isInteger(t.desk) && t.job && !t.now && !running.has(t.id)).sort((a, b) => a.desk - b.desk);
}

/** The desk: what the one machine is on, and under it your line of what it takes next. Sets the orb's mode. */
function deskTile(lined, ready) {
  const sys = state.system;
  if (!sys) return "";
  const blocked = sys.gates.filter(g => ["power", "memory"].includes(g.name) && !g.ok);
  const run = sys.running[0], on = run || sys.next, turn = turnItems().length;
  const card = on && state.tasks.find(t => t.id === on.id);
  // Only a power or memory gate "blocks"; and the machine waits on you only when it has nothing of its own.
  orb.mode = !sys.services.daemon ? "idle"
    : run ? ({ planning: "planning", "writing-tests": "tests", reviewing: "reviewing" }[run.status] || "coding")
    : sys.next && blocked.length ? "blocked" : turn && !sys.next ? "waiting" : "idle";
  const at = run ? (AT[run.status] ?? 3) : sys.next ? JOB_AT[sys.next.job] ?? 3 : -1;
  // A card you said to start now, not on the desk yet: the switch is under way until it is.
  const incoming = state.tasks.find(t => t.now && !t.archived && t.id !== run?.id && (t.job || t.stage === "draft"));
  const [kicker, cls] = !sys.services.daemon ? ["Stopped", "idle"] : run ? [incoming ? "Stepping aside" : "On the desk", ""]
    : orb.mode === "blocked" ? [`Held · ${blocked.map(g => g.detail).join("; ")}`, "blocked"]
    : sys.next ? ["Up next", "idle"] : orb.mode === "waiting" ? ["Waiting on you", ""] : ["Idle", "idle"];
  const title = on ? `<button data-id="${esc(on.id)}">${VERB[at]} ${esc(on.title)}</button><small>${esc([card && partOf(card).slice(3), on.model].filter(Boolean).join(" · "))}</small>`
    : orb.mode === "waiting" ? `${plural(turn, "thing")} need${turn === 1 ? "s" : ""} you<small>The machine has nothing else to do.</small>`
    : `Nothing on the desk<small>Give it a card, or capture an idea.</small>`;
  return `<section class="tile desk" aria-label="The desk">
    <canvas id="orb" role="img" aria-label="The machine is ${orb.mode}"></canvas>
    <span class="kicker ${cls}"><i></i>${esc(kicker)}</span>
    <h2>${title}</h2>
    ${card ? `<ol class="steps">${stepsFor(card)}</ol>` : ""}
    ${run ? `<div class="acts"><button class="action primary" data-id="${esc(run.id)}">Watch the run</button>`
      + `<button class="action" data-act="pause" data-act-id="${esc(run.id)}">Pause</button></div>` : ""}
    ${incoming ? `<div class="switching" role="status"><i class="spin"></i><div>
        <small>Starting now${run ? " · the current run is stepping aside" : ""}</small><span>${esc(incoming.title)}</span></div></div>`
      : `<div class="zone" data-zone="now">Drop a card here to start it now${run ? ". The current run steps aside and goes first in line." : ""}</div>`}
    <h3 class="lbl">Up next</h3>
    <ol class="upnext">${lined.map((t, i) => `<li draggable="true" data-drag="${esc(t.id)}" data-at="${i}">
      <span class="n">${i + 1}</span>
      <button class="what" data-id="${esc(t.id)}"><small>${will(t)}</small><span>${esc(t.title)}</span></button>
      <button class="ico" data-line="${esc(t.id)}" data-to="${i - 1}" aria-label="Move it earlier"${i ? "" : " disabled"}>↑</button>
      <button class="ico" data-line="${esc(t.id)}" data-to="${i + 1}" aria-label="Move it later"${i < lined.length - 1 ? "" : " disabled"}>↓</button>
      <button class="ico" data-line="${esc(t.id)}" data-to="" aria-label="Take it out of the line">×</button>
    </li>`).join("")}</ol>
    <div class="zone" data-zone="end">Drop a card here to add it to the end</div>
    <p class="why" style="margin:0">${ready ? `After ${lined.length ? "these" : "this"}, the desk takes the ${plural(ready, "ready card")} by itself. It is never idle while there is work.`
      : lined.length || run ? `Nothing else is ready. After ${lined.length ? "these" : "this"} the desk is idle.` : "Nothing is ready. The desk is idle until you give it something."}</p>
  </section>`;
}

/** The gates a run has to pass, and what it would run with. */
function machineTile() {
  const sys = state.system;
  if (!sys) return "";
  const gate = name => sys.gates.find(g => g.name === name) || { ok: true, detail: "unknown" };
  const memory = gate("memory"), power = gate("power"), free = memory.detail.match(/(\d+)% free/);
  const row = (label, value, ok = true) => `<div class="kv"><span>${label}</span><b class="${ok ? "" : "bad"}">${esc(value)}</b></div>`;
  return `<section class="tile" aria-labelledby="machine-h">
    <h2 class="lbl" id="machine-h">Machine</h2>
    ${row("Memory", memory.detail, memory.ok)}
    ${free ? `<div class="meter" aria-hidden="true"><i style="flex:${free[1]}"></i><span style="flex:${100 - free[1]}"></span></div>` : ""}
    ${row("Power", power.detail, power.ok)}
    ${row("Model", sys.model || "none")}
    ${row("Daemon", sys.services.daemon ? "running" : "stopped", Boolean(sys.services.daemon))}
  </section>`;
}

/** One card as a row. `says` is the line under its steps; `does` its one button, or a give-to-the-desk one. */
function cardRow(t, says, does = "") {
  const { at, yours } = standing(t);
  return `<div class="crow"${does ? "" : ` draggable="true" data-drag="${esc(t.id)}"`}>
    <button class="what" data-id="${esc(t.id)}"><b>${esc(t.title)}</b><small>${esc(t.repos.map(short).join(", ") + partOf(t))}</small></button>
    <div class="where"><span class="mini" role="img" aria-label="Step ${Math.min(at + 1, 7)} of 7">${[0, 1, 2, 3, 4, 5, 6].map(i =>
      `<i class="${i < at ? "done" : i === at ? (yours ? "at" : "here") : ""}"></i>`).join("")}</span><small>${says}</small></div>
    ${does || `<button class="action primary" data-line="${esc(t.id)}" data-to="9999">Give to the desk</button>`}
  </div>`;
}

const cardGroup = (name, rows, hint, cls = "") => `<section class="tile">
  <div class="sec-head"><h2>${name}</h2><span class="n ${cls}">${rows.length || ""}</span><span class="why">${hint}</span></div>
  ${rows.join("") || `<div class="clear">Nothing here.</div>`}
</section>`;

let homeHtml = "";
let focus = "anything";   // what the next scout is asked to look for

// A repository is busy while a scout of it is queued or its suggestions wait on you.
const scouting = repo => state.tasks.some(t => !t.archived && t.repos.includes(repo) && (t.scout || (t.suggested && t.stage === "draft")));

/** The buttons that send a scout out. With a run going, the scout steps in front of it. */
function findTile() {
  const busy = Boolean(state.system?.running.length);
  return !state.repos.length ? "" : `<section class="tile" aria-labelledby="find-h">
    <div class="sec-head"><h2 id="find-h">Find work</h2><span class="why">${busy
      ? "Have the machine read a repo and suggest 3 to 5 small fixes. It steps in front of the current run, which carries on afterwards."
      : "The machine is free. Have it read a repo and suggest 3 to 5 small fixes."}</span></div>
    <div class="pick" role="group" aria-label="What to look for">${(state.focuses || []).map(f =>
      `<button data-focus="${esc(f)}" aria-pressed="${f === focus}">${esc(f)}</button>`).join("")}</div>
    <div class="find">${state.repos.map(r => `<button class="action" data-analyze="${esc(r)}"${scouting(r)
      ? ` disabled title="Decide on what the last scout of it found first"` : ""}>Analyze ${esc(short(r))}</button>`).join("")}</div>
  </section>`;
}

async function analyze(repo) {
  const res = await api("/api/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ repo, focus, now: Boolean(state.system?.running.length) }),
  });
  if (!res.ok) { alert((await res.json()).error); return; }
  refresh();
}

/** Put a card at `index` in your line for the desk, or take it out with no index. */
async function lineUp(id, index) {
  const res = await api("/api/desk", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, index }),
  });
  if (!res.ok) { alert((await res.json()).error); return; }
  refresh();
}

function home() {
  const items = turnItems();
  document.getElementById("turn-n").textContent = items.length || "";
  const running = new Set((state.system?.running || []).map(t => t.id));
  const lined = linedUp(), inLine = new Set(lined.map(t => t.id));
  const ready = state.tasks.filter(t => t.job && !t.now && !inLine.has(t.id) && !running.has(t.id)).sort(byCreated);
  const drafts = state.tasks.filter(t => !t.archived && t.stage === "draft").sort(byCreated);
  const does = { answer: t => `Answer ${plural(t.open_questions.length || 1, "question")}`, failed: () => "See what failed",
    approve: () => "Check plan and tests", judge: () => "Judge it" };
  const html = `<div class="home"><div class="widgets">
    <div class="stack deskcol">
      ${deskTile(lined, ready.length)}
      ${machineTile()}
    </div>
    <div class="stack wide">
      ${cardGroup("Your move", items.map(({ kind, t }) => cardRow(t, NEEDS[kind],
        `<button class="action ${kind === "failed" ? "" : "you"}" data-id="${esc(t.id)}">${does[kind](t)}</button>`)),
        "A card that needs you leaves the desk and waits here. Once you answer, it goes back in line by itself.")}
      ${cardGroup("Ready for the desk", ready.map(t => cardRow(t, will(t))),
        "Work you already asked for. The desk takes these by itself when Up next is empty.", "idle")}
      ${drafts.length ? cardGroup("Drafts", drafts.map(t => cardRow(t, t.suggested
        ? `Suggested ${esc(t.kind || "idea")} · <button class="x" data-act="dismiss" data-act-id="${esc(t.id)}">Dismiss</button>` : "Not handed over yet")),
        "Ideas you have not handed over. The desk never takes these by itself.", "idle") : ""}
      ${findTile()}
    </div>
  </div></div>`;
  if (html !== homeHtml) document.getElementById("home").innerHTML = homeHtml = html;
}

// --- the card page: where a card stands, and the parts it is built in --------------------------

/** A packet's acceptance criteria, read off its markdown: a part's packet is not in the snapshot. */
function criteria(body) {
  const section = String(body || "").split(/^## /m).find(x => /^acceptance criteria/i.test(x)) || "";
  return section.split("\n").slice(1).map(l => l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/)?.[1]).filter(Boolean);
}

/** Tests, code, review for one part: done, now, stuck or still to come. */
function phases(k) {
  const stuck = ["failed", "question"].includes(k.status);
  const at = passed(k) ? 3 : k.stage === "review" ? 2 : k.stage === "under-work" ? 1
    : k.written_tests || (k.stage === "todo" && k.status !== "writing-tests" && k.attempts) ? 1 : 0;
  const live = !passed(k) && (LIVE.has(k.status) || k.stage === "under-work" || k.stage === "review");
  return ["tests", "code", "review"].map((name, i) =>
    `<span class="${i < at ? "done" : i === at ? (stuck ? "stuck" : live ? "now" : "") : ""}">${name}${i < at ? " ✓" : i === at && live ? " ···" : ""}</span>`).join("");
}

/** What each part wrote when it landed, by part number, out of the card's progress notes. */
function handoffs(progress) {
  const found = {};
  for (const chunk of String(progress || "").split(/^## Part /m).slice(1)) {
    const [, n, rest] = chunk.match(/^(\d+):[^\n]*\n([\s\S]*)/) || [];
    if (n) found[n] = rest.trim();
  }
  return found;
}

function partsTrack(owner, here) {
  const kids = owner.parts.map(p => state.tasks.find(x => x.id === p.id) || p);
  const notes = handoffs(owner.progress);
  const current = kids.find(k => !passed(k));
  const rows = kids.map((k, i) => {
    const where = passed(k) ? "done" : ["failed", "question"].includes(k.status) ? "stuck" : k === current && owner.stage === "todo" ? "now" : "later";
    const said = passed(k) ? "passed" : where === "now" ? (k.id === here ? "this part · now" : "now") : where === "stuck" ? k.status : i && !passed(kids[i - 1]) ? `after part ${i}` : k.status;
    const crit = criteria(k.body);
    const last = i === kids.length - 1;
    const note = notes[k.part];
    return `<li class="${where}">
        <div class="rail"><span class="num">${passed(k) ? "✓" : esc(k.part)}</span>${last ? "" : `<i class="${passed(k) ? "on" : ""}"></i>`}</div>
        <div class="pcard">
          <div class="top"><b><button data-id="${esc(k.id)}">${esc(k.title)}</button></b><span>${esc(said)}</span></div>
          <div class="phases">${phases(k)}</div>
          ${crit.length ? `<ul>${crit.map(c => `<li>${inline(c)}</li>`).join("")}</ul>` : ""}
        </div>
      </li>`
      + (last ? "" : `<li><div class="rail"><i class="dash"></i></div>
        <div class="handoff${note ? "" : " empty"}"><div class="lbl">Handoff note${note ? ` · from part ${esc(k.part)}` : ""}</div>${note
          ? `<div class="md">${md(note)}</div>` : `Written when part ${esc(k.part)} lands: what it decided and found, and its commits, for part ${esc(kids[i + 1].part)}.`}</div></li>`);
  }).join("");
  const end = owner.stage === "todo" ? "Then the whole branch is reviewed once, its app driven, and it comes to you as one pull request."
    : `The whole branch: ${esc(LABEL[owner.stage] || owner.stage)} · ${esc(owner.status)}.`;
  return `<h2 class="side-h">${kids.length ? `Built in ${kids.length} parts, on one branch` : `Split into ${owner.split} parts`}</h2>`
    + (kids.length ? `<ol class="ptrack">${rows}</ol>` : `<div class="side-box"><p style="margin:0">Approving makes the parts: each is coded in turn on one branch, and the card is reviewed once the last one passes. They are listed in the plan.</p></div>`)
    + (owner.blocked ? `<div class="note bad">Stuck: ${esc(owner.blocked)}</div>` : "")
    + `<p style="font-size:13px;color:var(--text-2);margin:0 0 18px">${end}</p>`;
}

/** A packet's markdown as its sections, by heading; and a section's list items. */
const sections = body => String(body || "").split(/^## /m).slice(1)
  .map(x => ({ title: x.split("\n")[0].trim(), text: x.slice(x.indexOf("\n") + 1).trim() }));
const bullets = text => text.split("\n").map(l => l.match(/^(?:[-*]|\d+\.)\s+(.*)/)?.[1]).filter(Boolean);

/** Where a card stands, with your two decisions as steps of their own: the plan, and the build. */
function standing(t) {
  const ready = t.stage === "planning" && ["ready", "question"].includes(t.status);
  const at = t.verdict ? 7 : t.stage === "draft" ? 0
    : t.stage === "planning" ? (ready ? 3 : t.status === "writing-tests" || t.planned ? 2 : 1)
    : ["todo", "under-work"].includes(t.stage) ? 4 : t.stage === "review" ? 5 : 6;
  return { at, yours: at === 3 || at === 6 || t.status === "question" };
}

function stepsFor(t) {
  const { at } = standing(t), rs = (t.rounds || []).length;
  const notes = [when(t.created), t.plan_model, at > 2 || t.written_tests ? "written" : "", "you",
    [t.model, rs && `round ${rs}`].filter(Boolean).join(" · "), t.booted ? (t.booted.ok ? "boots" : "won't boot") : "", t.verdict || "you"];
  return ["Idea", "Plan", "Tests", "Approve", "Code", "Review", "Verdict"].map((name, i) =>
    `<li class="${i < at ? "done" : i === at ? "at" : ""}"><b>${name}</b><small>${esc(notes[i] || "")}</small></li>`).join("");
}

function kickFor(t) {
  const { yours } = standing(t), owner = t.parent && state.tasks.find(x => x.id === t.parent);
  const cls = t.status === "failed" ? "blocked" : yours || (LIVE.has(t.status) && !t.paused) ? "" : "idle";
  return `<span class="kicker ${cls}"><i></i>${yours ? "Waiting on you · " : ""}${esc(LABEL[t.stage] || t.stage)} · ${esc(t.status)}`
    + `${t.paused ? " · paused" : ""}${t.now && !LIVE.has(t.status) && (t.job || t.stage === "draft") ? " · starting now" : t.aside ? " · stepping aside" : ""}${owner ? ` · part ${esc(t.part)} of ${owner.parts.length}` : ""}</span>`;
}

function factsFor(t) {
  const owner = t.parent ? state.tasks.find(x => x.id === t.parent) : null, landed = Object.entries(t.landed || {});
  const facts = [
    ["Repos", esc(t.repos.map(r => r.split("/").pop()).join(", ") || "none")],
    owner ? ["Part of", `<a href="#" data-open="${esc(owner.id)}">${esc(owner.title)}</a>`] : null,
    t.branches?.length ? ["Starts from", `<code>${esc(t.branches.map(b => b.split("@")[1]).join(", "))}</code>`] : null,
    landed.length ? ["Landed on", landed.map(([, b]) => `<code title="${esc(b)}">${esc(b)}</code>`).join("<br>")] : null,
    t.complexity ? ["Complexity", `<span class="cxbar" role="img" aria-label="${esc(t.complexity)} of 5">${[1, 2, 3, 4, 5].map(n => `<i class="${n <= t.complexity ? "on" : ""}"></i>`).join("")}</span>`] : null,
    t.plan_model ? ["Planned by", esc([t.plan_model, t.plan_reasoning].filter(Boolean).join(" · "))] : null,
    t.model ? ["Coded by", esc([t.model, t.reasoning].filter(Boolean).join(" · "))] : null,
    t.attempts ? ["Retries", esc(t.attempts)] : null,
    ["Captured", esc(when(t.created))],
  ].filter(Boolean);
  return `<section class="tile" aria-labelledby="facts-h"><h2 class="lbl" id="facts-h">Card</h2>${facts.map(([k, v]) =>
    `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join("")}</section>`;
}

/** The plan as tiles: the goal, each decision with its reason, and what done means as a checklist. */
function planTiles(t, notes, body) {
  const found = sections(body), take = re => found.find(x => re.test(x.title));
  const goal = take(/^goal/i), decisions = take(/^decisions/i), accept = take(/^acceptance/i);
  const noted = notes ? `<section class="tile">${notes}</section>` : "";
  if (!found.length) return noted + `<section class="tile"><div class="md">${md(body)}</div></section>`;
  const list = (title, section, row) => !section ? "" : `<section class="tile"><div class="sec-head"><h2>${title}</h2></div>`
    + (bullets(section.text).map(row).join("") || `<div class="md">${md(section.text)}</div>`) + `</section>`;
  return noted
    + (goal ? `<section class="tile"><h2 class="lbl">Goal</h2><div class="md goal">${md(goal.text)}</div></section>` : "")
    + list("Decisions", decisions, (d, i) => {
      // A decision reads "what -- why"; one you gave as an answer says so.
      const [what, ...why] = d.split(" -- ");
      return `<div class="prow"><span class="pnum">${i + 1}</span><div><b>${inline(what)}</b>`
        + (why.length ? `<span class="why">${inline(why.join(" -- "))}</span>` : "")
        + (d.includes("the owner's answer to:") ? `<span class="yours">Your answer</span>` : "") + `</div></div>`;
    })
    + list("Done when", accept, c => `<div class="prow"><span class="pcheck"></span><div>${inline(c)}</div></div>`)
    + found.filter(x => ![goal, decisions, accept].includes(x) && !/^current/i.test(x.title)).map(x =>
      `<section class="tile"><h2 class="lbl">${esc(x.title)}</h2><div class="md">${md(x.text)}</div></section>`).join("");
}

/** The tests written before any code: each opens to what it checks and why it fails now. */
function testsTile(t) {
  const w = t.written_tests, tests = w?.tests || [], total = w?.total ?? tests.length, red = w?.failing ?? 0;
  if (!w) return t.tests_note && t.stage === "planning" ? `<section class="tile"><h2 class="lbl">Tests</h2><span class="why">${esc(t.tests_note)}</span></section>` : "";
  return `<section class="tile" aria-labelledby="tests-h"><h2 class="lbl" id="tests-h">Tests written first</h2>
    <div><span class="big plain">${total}</span> <span class="why">test${total === 1 ? "" : "s"}</span></div>
    <span class="why">${red} fail${red === 1 ? "s" : ""} now, as ${red === 1 ? "it" : "they"} should${total - red ? ` · ${total - red} pass now` : ""}${total > tests.length ? ` · the first ${tests.length} listed` : ""}</span>
    <div>${tests.map(c => `<details class="trow"><summary><i class="${c.outcome === "passed" ? "ok" : ""}"></i><span><b>${esc(c.name)}</b>`
      + `<small>${c.outcome === "passed" ? "passes now" : "fails now"}${c.criterion ? ` · criterion ${esc(c.criterion)}` : ""}</small></span></summary>`
      + (c.checks ? `<p>${esc(c.checks)}</p>` : "") + (c.message ? `<pre>${esc(c.message)}</pre>` : "") + `</details>`).join("")}</div>
    <button class="linkish" data-tests="1">Read the test code</button>
  </section>`;
}

/** Beside the plan: the parts a card is built in, its tests, how things work today, and its history. */
function sideFor(t, plain, body, history) {
  const owner = t.parent ? state.tasks.find(x => x.id === t.parent) : null;
  const track = owner ? partsTrack(owner, t.id) : t.parts.length || t.split ? partsTrack(t, t.id) : "";
  const today = sections(body).find(x => /^current/i.test(x.title));
  return factsFor(t) + (track ? `<section class="tile">${track}</section>` : "") + (!plain ? "" : testsTile(t)
    + (today ? `<section class="tile"><h2 class="lbl">How it works today</h2><div class="md small">${md(today.text)}</div></section>` : ""))
    + (history ? `<section class="tile">${history.replace("<h2>", `<h2 class="lbl">`)}</section>` : "");
}

// A card's events as you would say them. The daemon restarting is not about the card, and a run
// starting is already said by the move that started it.
const QUIET = new Set(["daemon_started", "run_started", "baseline", "review_started", "reordered", "fetch_failed"]);
const MOVED = { draft: "Back to a draft", planning: "Sent to planning", todo: "Queued for coding", "under-work": "Coding started", review: "Review started", done: "Finished" };
const SAID = { created: "Captured", planned: "Planned", answered: "You answered a question", tests_started: "Test writing started",
  tests_written: "Tests written", tests_skipped: "Tests skipped", run_finished: "Coding finished", run_paused: "Coding paused",
  run_error: "Coding hit a machine error", reviewed: "Reviewed", review_asked: "The reviewer asked you a question",
  review_failed: "Review failed", review_error: "Review hit a machine error", review_paused: "Review paused", sent_back: "Sent back with comments",
  fix_requested: "You asked for fixes", judged: "You gave your verdict", pr_opened: "Pull request opened", plan_failed: "Planning failed",
  plan_paused: "Planning paused", paused: "Paused", resumed: "Resumed", retried: "Retried", retest: "Tests written again",
  rereview: "Sent for another review", overruled: "You overruled the review", now: "Marked to do now", scouted: "Suggestions filed", reclaimed: "Picked up again after a restart" };

// Whose run the log shows: the planner's, the test writer's, the coder's ("") or the reviewer's.
let logsOpen = false, logOf = "", testCode = false;
const LOGS = [["plan", "Planner"], ["tests", "Test writer"], ["", "Coder"], ["review", "Reviewer"]];
const logFor = t => t.stage === "review" ? "review" : t.stage !== "planning" ? "" : t.status === "planning" || !t.planned ? "plan" : "tests";

function logsView() {
  return `<div class="sec-head"><h2>Logs and thinking</h2><span style="flex:1"></span><button class="action" id="logs-back">Back to the card</button></div>
    <div class="pick" style="margin:12px 0 4px">${LOGS.map(([of, label]) => `<button data-log="${of}" aria-pressed="${logOf === of}">${label}</button>`).join("")}</div>
    <section class="live"><div id="ctx" class="ctx"></div><div class="run" id="run"></div></section>`;
}

let view = "home";
try { view = localStorage.getItem("rfa-view") === "board" ? "board" : "home"; } catch {}
function setView(next) {
  view = next;
  try { localStorage.setItem("rfa-view", view); } catch {}
  render();
}

// --- what the reviewer saw ---------------------------------------------------------------------

const shotUrls = new Map();   // `${id}/${attempts}/${name}` -> object URL

/** Fetch what we do not have yet, then draw the card again if anything arrived.
 *  Keyed by attempt as well as name: a second review writes the same filenames over the first. */
async function loadShots(t, names = t.shots || []) {
  let arrived = false;
  for (const name of names) {
    const key = `${t.id}/${t.attempts}/${name}`;
    if (shotUrls.has(key)) continue;
    shotUrls.set(key, "");   // claim it, so the next render does not fetch it again
    const res = await api(`/api/shot?id=${encodeURIComponent(t.id)}&name=${encodeURIComponent(name)}`);
    if (!res.ok) continue;
    shotUrls.set(key, URL.createObjectURL(await res.blob()));
    arrived = true;
  }
  if (arrived && detailId === t.id) showDetail(t.id);
}

function shotsGrid(t) {
  const have = (t.shots || []).map(n => [n, shotUrls.get(`${t.id}/${t.attempts}/${n}`)]).filter(([, u]) => u);
  const cell = ([n, u]) => `<a href="${u}" target="_blank" rel="noreferrer" title="${esc(n)}"><img src="${u}" alt=""><span>${esc(n.replace(/\.png$/, ""))}</span></a>`;
  // The reviewer names each shot for what it shows: the ones taken before the change, or while it
  // was finding its way, are folded under the ones that show the result.
  const aside = have.filter(([n]) => /^(before|debug)\b/i.test(n)), main = have.filter(([n]) => !/^(before|debug)\b/i.test(n));
  return (main.length ? `<div class="shots">${main.map(cell).join("")}</div>` : "")
    + (aside.length ? `<details class="more"${main.length ? "" : " open"}><summary>${plural(aside.length, "before and debug shot")}</summary>`
      + `<div class="shots">${aside.map(cell).join("")}</div></details>` : "");
}

// --- the run log -----------------------------------------------------------------------------

let watching = null;   // the card id whose steps are open; null = nobody asked

// Every command runs from `cd <its checkout> && ...`; the path is the same on every line, so it is
// left in the tooltip.
const shortCmd = c => c.replace(/^cd \S+ && /, "");

function runStep(s, cls) {
  const cmds = s.commands.map(shortCmd);
  const mark = cls === "now" ? "…" : s.returncode && !s.exit ? `✗${s.returncode}` : "✓";
  const open = cls === "bad" || s.exit;
  return (s.thought ? `<p class="thought">${esc(s.thought)}</p>` : "") + `<details class="step ${cls}"${open ? " open" : ""}>
    <summary title="${esc(s.commands.join("\n"))}"><span class="mark">${esc(mark)}</span><span class="cmd">${esc(cmds.join(" ; ") || "finished")}</span></summary>
    ${cmds.length ? `<pre class="full">${esc(cmds.join("\n"))}</pre>` : ""}
    ${s.output ? `<pre class="out">${esc(s.output)}</pre>` : ""}
  </details>`;
}

/** How full the coder's context is, where it resets and wraps up, and the note it resumed from. */
function contextView(c, steps) {
  const ran = steps.filter(s => !s.reset && !s.exit);
  const failed = ran.filter(s => s.returncode).length;
  const tiles = `<div class="tiles"><div><span>steps</span><b>${ran.length}</b></div>`
    + `<div><span>failed commands</span><b class="${failed ? "bad" : ""}">${failed}</b></div>`
    + `<div><span>resets</span><b>${c ? `${c.segments.length} of ${c.max_resets}` : "–"}</b></div></div>`;
  if (!c) return tiles;
  const pct = n => Math.min(100, Math.round(n / c.window * 100));
  const k = Math.round(c.window / 1000);
  let note = c.note;
  try {
    const parsed = JSON.parse(note);
    note = Object.entries(parsed).map(([key, v]) => `${key}: ${typeof v === "string" ? v : JSON.stringify(v)}`).join("\n");
  } catch {}
  return `<div class="head"><span>Context window</span><span>segment ${c.segments.length + 1} · ${pct(c.used)}% of ${k}k used</span></div>
    <div class="bar" role="img" aria-label="${pct(c.used)} percent of the context window used">
      <span class="fill" style="width:${pct(c.used)}%"></span>
      ${c.reset_at && c.segments.length < c.max_resets ? `<span class="mark reset" style="left:${c.reset_at * 100}%"></span>` : ""}
      ${c.wrap_up_at ? `<span class="mark wrap" style="left:${c.wrap_up_at * 100}%"></span>` : ""}
    </div>
    <div class="legend">
      ${c.reset_at ? `<span><i class="reset"></i>resets at ${Math.round(c.reset_at * 100)}% · ${c.segments.length} of ${c.max_resets} used</span>` : ""}
      ${c.wrap_up_at ? `<span><i class="wrap"></i>wraps up at ${Math.round(c.wrap_up_at * 100)}%</span>` : ""}
      ${c.segments.map((n, i) => `<span>segment ${i + 1} peaked at ${pct(n)}%</span>`).join("")}
    </div>
    ${tiles}
    ${note ? `<div class="note-box"><div class="lbl">Where it left off · the note it wrote before the reset</div><pre>${esc(note)}</pre></div>` : ""}`;
}

async function drawRun(id) {
  const box = document.getElementById("run");
  if (!box || watching !== id) return;
  // Follow new output only while the user is at the bottom: if they have scrolled up to read
  // earlier steps, new steps must not move the view; at the bottom, they land at the bottom.
  const body = document.getElementById("detail");
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight <= 40;
  const of = logsOpen ? logOf : (state.tasks.find(t => t.id === id) || {}).stage === "review" ? "review" : "";
  const res = await api(`/api/run?id=${encodeURIComponent(id)}&of=${of}`);
  if (!res.ok) return;
  const { steps, now, again, context } = await res.json();
  if (watching !== id || again) return;   // the panel moved on, or the file was caught mid-write
  // A finished step never changes, so the log only grows: what is on screen stays put, open steps,
  // scrolled outputs and all. It starts over only when the panel was redrawn or a new round began.
  let shown = Number(box.dataset.shown || 0);
  if (steps.length < shown) shown = 0, box.innerHTML = "";
  if (steps.length === shown && box.dataset.now === JSON.stringify(now)) return;
  const ctx = document.getElementById("ctx");
  if (ctx) ctx.innerHTML = contextView(context, steps);
  box.querySelector(".now, .hint")?.remove();
  box.insertAdjacentHTML("beforeend", steps.slice(shown).map(s => s.reset
      ? `<div class="reset-mark">context reset · resumed from its note</div>` : runStep(s, s.returncode && !s.exit ? "bad" : "")).join("")
    + (now?.length ? runStep({ commands: now }, "now") : ""));
  if (!box.children.length) box.innerHTML = `<div class="hint">Nothing yet — the first step lands when the model answers.</div>`;
  box.dataset.shown = steps.length;
  box.dataset.now = JSON.stringify(now);
  if (atBottom) body.scrollTop = body.scrollHeight;
}

// --- rounds, diffs and comments ----------------------------------------------------------------

const D2H = "https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles";
let d2h = null;             // the promise of diff2html, loaded the first time a diff is opened
const diffs = new Map();    // `${id}/${n}` -> what /api/diff said
const openDiffs = new Set();// `${id}/${n}` the user has open
let menuOpen = false;
const answers = new Map();  // `${id}\n${question}` -> a half-written answer, so a redraw keeps it
let commentAt = null;       // the line a comment is being written on; the panel holds still meanwhile
let lastBody = "";          // what the panel was last drawn from, so a refresh that changes nothing leaves it be
let boardHtml = "";         // the same, for the columns
let lastSnapshot = "";      // the snapshot as it came, so a push that changes nothing redraws nothing
let tab = "runs";           // which of a done card's tabs is showing

function loadD2h() {
  return d2h ||= new Promise((resolve, reject) => {
    const css = Object.assign(document.createElement("link"), { rel: "stylesheet", href: `${D2H}/css/diff2html.min.css` });
    const js = Object.assign(document.createElement("script"), { src: `${D2H}/js/diff2html-ui-slim.min.js` });
    js.onload = resolve;
    js.onerror = () => { d2h = null; reject(new Error("diff2html did not load — is the network up?")); };
    document.head.append(css, js);
  });
}

/** The latest round that landed: the one whose diff takes comments. */
const latestLanded = t => Math.max(-1, ...(t.rounds || []).filter(r => r.landed).map(r => r.n));

function testsLine(r) {
  if (r.tests === undefined) return "";
  if (r.tests === null) return `<div class="tests">No test command configured for this repository — nothing was run beyond the card's checks.</div>`;
  const c = r.tests.counts || {}, failed = c.failed || 0, tries = r.tests.attempts || 1;
  const verdict = r.tests.ok ? `<span class="ok">✓ Tests passed</span>` : `<span class="bad">✗ Tests failed</span>`;
  const how = tries > 1 ? (r.tests.ok ? ` — on attempt ${tries}, after ${tries - 1} automatic fix${tries > 2 ? "es" : ""}` : ` after ${tries} attempts`) : "";
  return `<div class="tests">${verdict}${how} · ${c.passed || 0} passed · ${failed} failed · ${c.skipped || 0} skipped`
    + (c.known ? ` · ${c.known} already failing before this change` : "")
    + ` <span title="${esc(r.tests.command)}">· <code>${esc(r.tests.command)}</code></span></div>`;
}

function commentList(list, removable) {
  return `<ul class="cmts">${list.map(c => `<li>`
    + `<div class="where">${c.file ? `${esc(c.repo)}/${esc(c.file)}:${esc(c.line)}${c.side === "old" ? " (removed line)" : ""}` : "Whole round"}</div>`
    + `<div>${esc(c.text)}${removable ? ` <button data-uncomment="${esc(c.id)}" title="Delete comment">✕</button>` : ""}</div>`
    + (c.answer !== undefined ? `<div class="answer">${esc(c.answer || "The coder gave no answer for this one.")}</div>` : "")
    + `</li>`).join("")}</ul>`;
}

function roundsView(t) {
  const rs = t.rounds || [];
  const original = rs.find(r => r.kind === "original");
  const fixes = rs.filter(r => r.kind === "fix" && r.landed);
  const answered = fixes.reduce((n, r) => n + (r.comments || []).length, 0);
  let html = `<p class="overall">${esc(original?.summary || "No summary was written for this run.")}`
    + (fixes.length ? ` ${fixes.length} review round${fixes.length > 1 ? "s" : ""} since, fixing ${answered} comment${answered === 1 ? "" : "s"}.` : "")
    + `</p>`;
  if ((t.pending || []).length)
    html += `<div class="pending"><div class="sec">Comments for the next fix · ${t.pending.length}</div>${commentList(t.pending, true)}</div>`;
  const commentable = t.stage === "done" ? latestLanded(t) : -1;
  // For what no one line says: a change of direction, or something the diff never touched.
  if (commentable >= 0)
    html += `<p><button class="action small" id="comment-round">Comment on the whole round</button></p>`;

  let k = 0;
  const labels = new Map(rs.map(r => [r.n, r.kind === "original" ? "Original coding round"
    : (r.comments || []).length ? `Review round ${++k}` : `Re-run ${++k}`]));
  for (const r of [...rs].reverse()) {
    const key = `${t.id}/${r.n}`;
    // One round needs no heading of its own: the summary above it is already that round's.
    html += rs.length === 1 && r.landed ? `<section class="round solo">` : `<section class="round"><div class="sec">${esc(labels.get(r.n))}`
      + (r.landed ? "" : `<span class="tag">nothing landed</span>`) + `</div>`;
    if (r.error) html += `<div class="note bad">${esc(r.error)}</div>`;
    if (r.kind === "original" && r.plan)
      html += `<details class="plan"><summary>The plan it was given</summary><div class="md">${md(String(r.plan).replace(/^\s*#\s+Task\s*\n+[^\n]*\n/, ""))}</div></details>`;
    if (r.kind === "fix" && (r.comments || []).length) html += commentList(r.comments, false);
    if (r.summary && r.kind === "fix") html += `<p>${esc(r.summary)}</p>`;
    if (r.summary && r.kind === "original" && rs.length > 1) html += `<p>${esc(r.summary)}</p>`;
    const outside = Object.entries(r.outside || {});
    if (outside.length)
      html += `<details class="more"><summary>Also changed ${plural(outside.reduce((n, [, fs]) => n + fs.length, 0), "file")} no comment was on</summary>`
        + `<div class="warn">${outside.map(([repo, fs]) => fs.map(f => `<code>${esc(repo)}/${esc(f)}</code>`).join(", ")).join(", ")}</div></details>`;
    html += testsLine(r);
    // The first round's diff is the whole change, which All changes shows; a fix has its own.
    html += (r.kind === "original" ? "" : `<button class="action small" data-diff="${r.n}">${openDiffs.has(key) ? "Hide diff" : "View what this round changed"}${r.landed ? "" : " (not landed)"}</button>`
      + `<div class="diffbox" id="diff-${r.n}"></div>`) + `</section>`;
  }
  return html;
}

function linksRow(t) {
  const prs = Object.entries(t.prs || {});
  const landed = Object.entries(t.landed || {});
  if (!prs.length && !landed.length && !t.link) return "";
  return `<div class="links">`
    + prs.map(([r, u]) => `<span>PR ${link(u)}</span>`).join("")
    + (landed.length && landed.some(([r]) => !(t.prs || {})[r]) ? `<button class="action small" data-pr="${esc(t.id)}">Create GitHub PR</button>` : "")
    + landed.map(([r, b]) => `<span><code>${esc(b)}</code> in ${esc(r)}</span>`).join("")
    + (t.link ? `<span>From ${link(t.link)}</span>` : "")
    + `</div>`;
}

async function toggleDiff(t, n) {
  const key = `${t.id}/${n}`;
  openDiffs.has(key) ? openDiffs.delete(key) : openDiffs.add(key);
  lastBody = "";
  showDetail(t.id);
}

/** Draw every open diff of the card into its box, fetching what is not here yet. */
async function drawDiffs(t) {
  for (const r of t.rounds || []) {
    const key = `${t.id}/${r.n}`, box = document.getElementById(`diff-${r.n}`);
    if (!box || !openDiffs.has(key)) continue;
    box.innerHTML = `<div class="hint">reading the diff…</div>`;
    try {
      await loadD2h();
      if (!diffs.has(key)) {
        const res = await api(`/api/diff?id=${encodeURIComponent(t.id)}&round=${r.n}`);
        if (!res.ok) throw new Error((await res.json()).error);
        diffs.set(key, await res.json());
      }
    } catch (e) { box.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; continue; }
    if (document.getElementById(`diff-${r.n}`) !== box) return;   // the panel was redrawn meanwhile
    paint(box, diffs.get(key), t, false, "This round changed nothing.");
  }
}

/** Everything the card changed, start to latest round: what a pull request would show. Read only. */
async function drawFullDiff(t) {
  const box = document.getElementById("diff-full"), key = `${t.id}/full/${latestLanded(t)}`;
  if (!box) return;
  box.innerHTML = `<div class="hint">reading the diff…</div>`;
  try {
    await loadD2h();
    if (!diffs.has(key)) {
      const res = await api(`/api/fulldiff?id=${encodeURIComponent(t.id)}`);
      if (!res.ok) throw new Error((await res.json()).error);
      diffs.set(key, await res.json());
    }
  } catch (e) { box.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; return; }
  if (document.getElementById("diff-full") !== box) return;
  paint(box, diffs.get(key), t, t.stage === "done", "Nothing landed, so there is nothing to compare.");
  const patches = diffs.get(key).repos.map(r => r.patch).join("\n");
  const count = re => (patches.match(re) || []).length, files = count(/^diff --git /gm);
  document.getElementById("full-sum").textContent = `${files} file${files === 1 ? "" : "s"} changed · `
    + `+${count(/^\+(?!\+\+ )/gm)} −${count(/^-(?!-- )/gm)} · from where the first round started to the latest round.`;
}

// Files you folded, per card and per diff, so a redraw leaves what you have checked folded.
const folded = new Set();
const foldKey = (box, repo, path) => `${openId}/${box.id}/${repo}/${path}`;
const keyOf = file => foldKey(file.closest(".diffbox"), file.dataset.repo, file.dataset.path);

/** Fold a file to its header or open it again, and tick it off in the tree while it is folded. */
function fold(file, open = folded.has(keyOf(file))) {
  const key = keyOf(file);
  open ? folded.delete(key) : folded.add(key);
  file.classList.toggle("folded", !open);
  [...file.closest(".diffbox").querySelectorAll(".ftree [data-goto]")].find(b => b.dataset.goto === key)?.classList.toggle("done", !open);
  // Folding a file you had scrolled into leaves you at its header, not somewhere in the next file.
  const top = document.querySelector(".tabs")?.getBoundingClientRect().bottom ?? 0;
  if (file.getBoundingClientRect().top < top) file.scrollIntoView({ block: "start" });
}

/** Jump to a file from the tree, opening it if you had folded it away. */
function goto(box, key) {
  const file = [...box.querySelectorAll(".d2h-file-wrapper")].find(f => keyOf(f) === key);
  if (!file) return;
  if (folded.has(key)) fold(file, true);
  file.scrollIntoView({ block: "start" });
}

/** Each file a patch touches: its path, what happened to it, and the lines it gained and lost. */
function patchFiles(patch) {
  return String(patch).split(/^(?=diff --git )/m).filter(c => c.startsWith("diff --git ")).map(c => ({
    path: c.match(/^diff --git a\/.+? b\/(.+)$/m)?.[1] || "",
    status: /^new file mode/m.test(c) ? "A" : /^deleted file mode/m.test(c) ? "D" : /^rename from/m.test(c) ? "R" : "M",
    add: (c.match(/^\+(?!\+\+ )/gm) || []).length,
    del: (c.match(/^-(?!-- )/gm) || []).length,
  }));
}

/** The changed files as folders, a folder with only one folder in it merged into it the way GitHub does. */
function fileTree(box, found) {
  const root = { dirs: new Map(), files: [] };
  for (const repo of found.repos)
    for (const f of patchFiles(repo.patch)) {
      const parts = [...(found.repos.length > 1 ? [repo.repo] : []), ...f.path.split("/")];
      let node = root;
      for (const dir of parts.slice(0, -1)) {
        if (!node.dirs.has(dir)) node.dirs.set(dir, { dirs: new Map(), files: [] });
        node = node.dirs.get(dir);
      }
      node.files.push({ ...f, name: parts.at(-1), key: foldKey(box, repo.repo, f.path) });
    }
  const draw = node => `<ul>${[...node.dirs].map(([name, dir]) => {
      while (dir.dirs.size === 1 && !dir.files.length) { const [[next, inner]] = dir.dirs; name += `/${next}`; dir = inner; }
      return `<li><details open><summary>${esc(name)}/</summary>${draw(dir)}</details></li>`;
    }).join("")}${node.files.map(f => `<li><button data-goto="${esc(f.key)}"${folded.has(f.key) ? ` class="done"` : ""} title="${esc(f.path)}">`
      + `<span class="st ${f.status}">${f.status}</span><span class="nm">${esc(f.name)}</span>`
      + `<span class="add">+${f.add}</span><span class="del">−${f.del}</span></button></li>`).join("")}</ul>`;
  return `<nav class="ftree">${draw(root)}</nav>`;
}

function paint(box, found, t, commentable, empty) {
  box.innerHTML = found.repos.length ? "" : `<div class="hint">${empty}</div>`;
  if (found.repos.flatMap(r => patchFiles(r.patch)).length > 1) box.insertAdjacentHTML("beforeend", fileTree(box, found));
  for (const repo of found.repos) {
    const el = document.createElement("div");
    if (found.repos.length > 1) box.insertAdjacentHTML("beforeend", `<div class="repo-name">${esc(repo.repo)}</div>`);
    if (repo.error) box.insertAdjacentHTML("beforeend", `<div class="note bad">${esc(repo.error)}</div>`);
    box.append(el);
    const ui = new Diff2HtmlUI(el, repo.patch, { drawFileList: false, outputFormat: "line-by-line", matching: "lines", colorScheme: "auto", fileContentToggle: false });
    ui.draw();
    ui.highlightCode();
    decorate(el, t, repo, commentable);
    for (const file of el.querySelectorAll(".d2h-file-wrapper")) {
      Object.assign(file.dataset, { repo: repo.repo, path: (file.querySelector(".d2h-file-name")?.textContent || "").split(" → ").pop().trim() });
      file.classList.toggle("folded", folded.has(keyOf(file)));
    }
  }
}

/** Test marks on the lines tests are defined on, and comment hooks on every numbered line. */
function decorate(root, t, repo, commentable) {
  for (const file of root.querySelectorAll(".d2h-file-wrapper")) {
    const path = (file.querySelector(".d2h-file-name")?.textContent || "").split(" → ").pop().trim();
    const rows = [...file.querySelectorAll("tr")];
    for (const tr of rows) {
      const cell = tr.querySelector("td.d2h-code-linenumber");
      const now = tr.querySelector(".line-num2")?.textContent.trim(), was = tr.querySelector(".line-num1")?.textContent.trim();
      if (!cell || !(now || was)) continue;
      const m = now && repo.marks?.[path]?.[now];
      if (m) {
        const why = { passed: "passed", failed: "failed", skipped: "skipped", missing: "did not run — it is not in the test report" }[m.outcome];
        const before = m.before === "failed" || m.before === "error" ? " (failing before this change too)" : "";
        cell.insertAdjacentHTML("afterbegin", `<span class="tmark ${m.outcome}" title="${esc(`${m.name}: ${why}${before}${m.message ? `\n\n${m.message}` : ""}`)}">`
          + `${{ passed: "✓", skipped: "–" }[m.outcome] || "✗"}</span>`);
      }
      if (commentable) Object.assign(tr.dataset, { repo: repo.repo, file: path, line: now || was, side: now ? "new" : "old" }), tr.classList.add("commentable");
    }
    // Comments already left on this file, under the line each is on.
    for (const c of (t.pending || []).filter(c => c.repo === repo.repo && c.file === path)) {
      const tr = rows.find(tr => tr.dataset.line === String(c.line) && tr.dataset.side === c.side);
      tr?.insertAdjacentHTML("afterend", `<tr class="rfa-comment"><td colspan="2"><strong>You:</strong> ${esc(c.text)}`
        + ` <button class="action small quiet" data-uncomment="${esc(c.id)}">Delete</button></td></tr>`);
    }
  }
}

function commentForm(where, placeholder) {
  return `<textarea id="comment-text" placeholder="${placeholder}"></textarea>`
    + `<div class="row"><span>${esc(where)} · ⌘↵ to save</span>`
    + `<button class="action small quiet" id="comment-cancel">Cancel</button>`
    + `<button class="action small primary" id="comment-save">Comment</button></div>`;
}

function openCommentForm(tr) {
  closeCommentForm();
  commentAt = { ...tr.dataset, context: tr.querySelector(".d2h-code-line-ctn")?.textContent || "" };
  tr.insertAdjacentHTML("afterend", `<tr class="rfa-comment form"><td colspan="2">`
    + commentForm(`${commentAt.file}:${commentAt.line}`, "What should change here?") + `</td></tr>`);
  document.getElementById("comment-text").focus();
}

/** A comment on no line: it reaches the coder as one on the round as a whole. */
function openRoundCommentForm(button) {
  closeCommentForm();
  commentAt = {};
  button.parentElement.hidden = true;
  button.parentElement.insertAdjacentHTML("afterend", `<div class="rfa-comment form">`
    + commentForm("On the whole round", "What should change, anywhere in the work?") + `</div>`);
  document.getElementById("comment-text").focus();
}

async function saveComment() {
  const text = document.getElementById("comment-text")?.value.trim();
  if (!text || !commentAt || !openId) return;
  const res = await api("/api/comment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: openId, ...commentAt, ...(commentAt.file && { line: Number(commentAt.line) }), text }),
  });
  if (!res.ok) { alert((await res.json()).error); return; }
  closeCommentForm();
  await refresh();
}

function closeCommentForm() {
  commentAt = null;
  lastBody = "";
  document.querySelector(".rfa-comment.form")?.remove();
  const whole = document.getElementById("comment-round");
  if (whole) whole.parentElement.hidden = false;
}

async function deleteComment(cid) {
  const res = await api("/api/comment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: openId, delete: cid }),
  });
  if (!res.ok) { alert((await res.json()).error); return; }
  lastBody = "";
  await refresh();
}

async function fixComments(id) {
  const res = await api("/api/fix", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id }),
  });
  if (!res.ok) { alert((await res.json()).error); return; }
  menuOpen = false;
  closeDetail();
  await refresh();
}

function showDetail(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return closeDetail();
  // Writing a comment: a refresh must not throw the half-typed text away with the panel.
  if (commentAt && detailId === id) return;
  // A card opened while its coder works opens on the run: that is what there is to look at.
  if (detailId !== id) testCode = false, logsOpen = t.stage === "under-work" && LIVE.has(t.status), logOf = "", watching = logsOpen ? id : null;
  openId = id;
  document.getElementById("detail").classList.add("page");
  const { yours } = standing(t);
  document.getElementById("d-kick").innerHTML = kickFor(t);
  document.getElementById("d-title").textContent = t.title;
  document.getElementById("d-steps").innerHTML = stepsFor(t);
  document.getElementById("d-sub").textContent = t.stage === "planning" && t.status === "ready"
    ? "Approving sends the plan and its tests to the coder. It codes until the tests pass and may not change them." : "";
  const from = (t.branches || []).map(b => b.split("@")[1]).join(", ");
  const reading = (t.context_branches || []).map(b => b.split("/").pop()).join(", ");

  let head = "";
  if (t.error) head += `<div class="note bad">${esc(t.error)}</div>`;
  if (t.offline) head += `<div class="note">${esc(t.offline)}</div>`;
  if (prNote?.id === id)
    head += `<div class="note${prNote.bad ? " bad" : ""}">${esc(prNote.text)}</div>`;
  if (from || reading)
    head += `<div class="note">${from ? `Starts from <code>${esc(from)}</code>` : ""}`
      + `${reading ? `${from ? " · " : ""}reading <code>${esc(reading)}</code>` : ""}</div>`;
  const prs = Object.entries(t.prs || {});
  const landed = Object.entries(t.landed || {}).filter(([r]) => !(t.prs || {})[r]);
  if (landed.length)
    head += `<div class="note">Landed on ${landed.map(([r, b]) => `<code>${esc(b)}</code> in ${esc(r)}`).join(", ")} — local, nothing pushed.</div>`;
  // The branch is already in your checkout; this is the line that brings it over to what you have
  // open, as changes you read and stage yourself rather than a commit that arrives behind you.
  const copies = Object.entries(t.copy || {});
  if (copies.length)
    head += `<div class="note">Take it into your current branch — unstaged, merged three-way, `
      + `so a clash leaves conflict markers rather than refusing:`
      + copies.map(([r, cmd]) => `<div class="copy"><code>${esc(cmd)}</code>`
        + `<button class="action" data-copy="${esc(r)}">Copy</button></div>`).join("") + `</div>`;
  if (prs.length)
    head += `<div class="note">Pull request${prs.length > 1 ? "s" : ""} open: `
      + prs.map(([r, u]) => `${link(u)} in ${esc(r)}`).join(", ") + `</div>`;
  if (t.link) head += `<div class="note">From ${link(t.link)}</div>`;
  if (t.paused)
    head += `<div class="note">${LIVE.has(t.status)
      ? "Pausing — the run stops before its next model call and the card goes back to its queue."
      : `Paused — the daemon leaves it alone until you <strong>Resume</strong>. ${t.kept
        ? "The coder's changes and its note are kept: it carries on from them." : "A run starts over from the beginning."}`}</div>`;
  if (t.stage === "draft") head += `<div class="note">A draft. <strong>Edit</strong> changes any part of it; <strong>Plan it</strong> hands it to the planner${t.planned ? ", or <strong>Approve as is</strong> sends this packet straight to the coder" : ""}.</div>`;
  if (t.status === "queued" && t.stage === "planning" && !t.paused)
    head += `<div class="note">${t.planned ? "Planned. Waiting to have its tests written" : "Waiting for the planner"} — <code>rfa plan</code></div>`;
  if (t.status === "writing-tests") head += `<div class="note">Writing the tests from this packet — the <strong>Run log</strong> is not kept for this step; it lands here when done.</div>`;
  const asking = t.stage === "review" || t.status === "question";
  const questions = (t.stage === "planning" || t.stage === "review") && t.open_questions?.length ? (t.packet || asking
      ? `<div class="note"><strong>${t.stage === "review" ? "The reviewer asks" : "Open questions"}</strong> — an answer goes into the packet as a decision${t.stage === "review" ? ", and the last one sends the card back to the reviewer" : t.status === "question" ? ", and the last one sends the card on to have its tests written" : ""}.<ul class="oq">${t.open_questions.map((q, i) =>
          `<li><p>${esc(q)}</p><div class="answer"><textarea rows="1" data-oq="${i}" placeholder="Your answer">${esc(answers.get(`${t.id}\n${q}`) || "")}</textarea>`
          + `<button class="action" data-answer="${i}">Answer</button></div></li>`).join("")}</ul></div>`
      : `<div class="note"><strong>Open questions</strong><ul>${t.open_questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul></div>`) : "";
  head += questions;

  const mine = state.events.filter(e => e.id === t.id && !QUIET.has(e.type));
  const history = mine.length
    ? `<h2>History</h2><ul class="timeline">${mine.map(e =>
        `<li><time>${when(e.ts)}</time><span>${esc(e.type === "moved" ? MOVED[e.to] || `Moved to ${e.to}` : SAID[e.type] || e.type.replaceAll("_", " "))}`
        + `${e.url ? ` ${link(e.url)}` : ""}</span></li>`).join("")}</ul>`
    : "";

  // The packet opens with "# Task" and its title; the panel header already says that.
  const fullBody = String(t.body || "");
  const body = fullBody.replace(/^\s*#\s+Task\s*\n+[^\n]*\n/, "");
  // Only where there is a run to look at: a card that never reached the coder has no trajectory.
  const ran = ["under-work", "review", "done"].includes(t.stage);
  // Re-rendering the card that is already open must not yank the panel back to the top; a new
  // card, or coming back from editing, starts at the top.
  const panel = document.getElementById("d-body");
  const page = document.getElementById("detail");
  const saved = detailId === id && !editing ? page.scrollTop : 0;
  panel.classList.toggle("editing", editing);
  // A card that reached the coder is read round by round; the rest is still the packet and its notes.
  const rounded = ran && !editing;
  const rs = t.rounds || [];
  if (tab !== "full" || latestLanded(t) < 0) tab = "runs";
  const coded = testCode && t.written_tests;
  const sideHtml = sideFor(t, !rounded && !editing, body, history);
  if (document.getElementById("d-side").dataset.from !== sideHtml) {
    document.getElementById("d-side").innerHTML = sideHtml;
    document.getElementById("d-side").dataset.from = sideHtml;
  }
  panel.classList.toggle("one", Boolean(editing || logsOpen || coded));
  let html;
  if (editing) {
    // A planned card is edited section by section; the rest of the packet is preserved on save.
    html = head + (t.packet ? packetEdit(t) : `<textarea id="edit-body">${esc(fullBody)}</textarea>`);
  } else if (logsOpen) {
    html = logsView();
  } else if (rounded) {
    const top = (asking ? questions : "") + (t.error ? `<div class="note bad">${esc(t.error)}</div>` : "")
      + (t.offline ? `<div class="note">${esc(t.offline)}</div>` : "")
      + (prNote?.id === id ? `<div class="note${prNote.bad ? " bad" : ""}">${esc(prNote.text)}</div>` : "")
      + (t.paused ? `<div class="note">${LIVE.has(t.status) ? "Pausing — the run stops before its next model call." : "Paused until you <strong>Resume</strong>."}</div>` : "");
    // What was built, round by round; every change together, when you ask; and what the reviewer saw.
    const all = tab === "full";
    html = (top ? `<section class="tile">${top}</section>` : "")
      + `<section class="tile"><div class="sec-head"><h2>Result</h2><span class="why">${plural(rs.length, "round")}</span></div>`
      + (rs.length ? linksRow(t) + roundsView(t) : `<p class="tests">No round has finished yet. <strong>Logs and thinking</strong> shows the coder as it works.</p>`)
      + `</section>`
      + (latestLanded(t) < 0 ? "" : `<section class="tile"><div class="sec-head"><h2>All changes</h2>`
        + `<span class="why" id="full-sum">From where the first round started to the latest round.</span>`
        + (all && t.stage === "done" ? `<span class="why">Click a line number to comment.</span>` : "") + `<span style="flex:1"></span>`
        + `<button class="action" data-tab="${all ? "runs" : "full"}">${all ? "Hide" : "Show"}</button></div>`
        + (all ? `<div class="diffbox" id="diff-full"></div>` : "") + `</section>`)
      + ((t.shots || []).length ? `<section class="tile"><div class="sec-head"><h2>What the reviewer saw</h2><span class="why">${plural(t.shots.length, "screenshot")}</span></div>`
        + (shotsGrid(t) || `<div class="hint">loading the screenshots…</div>`) + `</section>` : "");
  } else {
    html = coded ? testsView(t) : planTiles(t, head, body);
  }
  // Redrawing the same thing would close every open diff and the `details` you opened; only a change redraws.
  // Compared by what it is drawn from, not by the html: "3m ago" becoming "4m ago" is no change.
  const drawnFrom = JSON.stringify([t, mine, prNote?.id === id && prNote, watching === id, tab, shotsGrid(t), testCode, logsOpen, logOf]);
  if (detailId !== id || editing || drawnFrom !== lastBody) {
    panel.innerHTML = html;
    lastBody = drawnFrom;
    if (rounded && !logsOpen) drawDiffs(t);
    if (rounded && !logsOpen && tab === "full") drawFullDiff(t);
  }
  page.scrollTop = saved;
  detailId = id;
  if (watching === id) drawRun(id);
  if ((t.shots || []).length) loadShots(t);
  if (editing) {
    document.getElementById("d-actions").innerHTML = `<button class="action primary" id="save-edit">Save</button><button class="action quiet" id="cancel-edit">Cancel</button>`;
  } else {
    document.getElementById("d-actions").innerHTML = actionsFor(t)
      + (t.now || t.stage === "done" || t.archived || LIVE.has(t.status) ? ""
        : `<button class="action" id="now" title="Ahead of everything else; a run in its way steps aside and carries on afterwards">Do this now</button>`)
      + (t.now && !LIVE.has(t.status) && (t.job || t.stage === "draft") ? `<span class="switching" role="status" style="min-height:38px;padding:0 14px"><i class="spin"></i><small>Starting now</small></span>` : "")
      + (t.stage === "draft" ? "" : `<button class="action" id="logs" aria-pressed="${logsOpen}">Logs and thinking</button>`);
  }
  document.getElementById("d-actions").toggleAttribute("data-yours", yours && !editing);
  openPanel();
  // Measured once the panel shows: hidden, every textarea is zero tall.
  panel.querySelectorAll(".pe-list textarea, .oq textarea").forEach(grow);
}

/** The tests written before any code: what each one checks and why it fails now, then the code, file by file. */
function testsView(t) {
  const w = t.written_tests;
  const code = Object.entries(w.patches || {}).flatMap(([repo, patch]) =>
    String(patch).split(/^(?=diff --git )/m).filter(c => c.startsWith("diff --git ")).map(chunk => {
      const path = chunk.match(/^diff --git a\/.+? b\/(.+)$/m)?.[1] || "";
      const added = /^new file mode/m.test(chunk);
      const at = chunk.search(/^@@/m);
      const lines = (at < 0 ? "" : chunk.slice(at)).trimEnd().split("\n").filter(l => !(added && l.startsWith("@@")));
      // A new file reads as the file; a changed one as its hunks, with what was added and removed marked.
      const body = lines.map(l => added ? esc(l.slice(1))
        : l.startsWith("@@") ? `<span class="hunk">${esc(l)}</span>`
        : `<span class="${l[0] === "+" ? "add" : l[0] === "-" ? "del" : ""}">${esc(l)}</span>`).join("\n");
      return `<details class="wt-code" open><summary><code>${esc(repo)}/${esc(path)}</code>${added ? " — new" : ""}</summary><pre><code>${body}</code></pre></details>`;
    })).join("");
  return `<div class="sec-head"><h2>Test code</h2><span style="flex:1"></span><button class="action" data-tests="0">Back to the plan</button></div>`
    + `<div class="md"><p class="tests">${w.summary ? `${esc(w.summary)} ` : ""}Run by <code>${esc(w.command)}</code>. The coder may not change these.</p>${code}</div>`;
}

async function retest(id) {
  const res = await api("/api/retest", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }),
  });
  if (!res.ok) { alert((await res.json()).error); return; }

/** The owner's answer joins the decisions and the question leaves the list, so the packet stands on its own. */
async function answerQuestion(i) {
  const t = state.tasks.find(x => x.id === openId);
  const answer = (answers.get(`${t.id}\n${t.open_questions[i]}`) || "").trim();
  if (!answer) return document.querySelector(`.oq textarea[data-oq="${i}"]`)?.focus();
  return sendAnswer(t, i, answer);
}

async function sendAnswer(t, i, answer) {
  const q = t.open_questions[i];
  // A question a stage stopped on is answered by the host, which knows where in the packet it goes and what comes next.
  const asking = t.stage === "review" || t.status === "question";
  const res = await api(asking ? "/api/answer" : "/api/edit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(asking ? { id: t.id, index: i, answer } : {
      id: t.id,
      decisions: [...t.packet.decisions, `${answer} -- the owner's answer to: ${q}`],
      open_questions: t.open_questions.filter((_, j) => j !== i),
    }),
  });
  if (!res.ok) { alert((await res.json()).error); return; }
  answers.delete(`${t.id}\n${q}`);
  await refresh();
}

async function createPR(id) {
  const btn = document.querySelector(`button[data-pr="${esc(id)}"]`);
  if (btn) btn.disabled = true;
  const res = await api("/api/pr", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id }),
  });
  // A PR that opened is on the card and in the history now; only a failure needs the transient note.
  prNote = res.ok ? null : { id, text: (await res.json()).error, bad: true };
  refresh();
}

function closeDetail() {
  drafting = null;
  watching = null;
  editing = false;
  openId = null;
  detailId = null;
  prNote = null;
  commentAt = null;
  menuOpen = false;
  lastBody = "";
  openDiffs.clear();
  tab = "runs";
  // A card page closes as it opened, at once; it stays a page until a form opens the side panel.
  document.getElementById("detail").classList.remove("open");
  delete document.getElementById("d-side").dataset.from;
  document.getElementById("detail").setAttribute("aria-hidden", "true");
  document.getElementById("scrim").classList.remove("open");
}

async function refresh() {
  const res = await api("/api/tasks");
  if (!res.ok) {
    document.getElementById("strip").innerHTML =
      `<span class="shut">${esc((await res.json()).error)}</span>`;
    return;
  }
  const text = await res.text();
  if (text === lastSnapshot) return;
  state = JSON.parse(lastSnapshot = text);
  render();
}

// The server says "changed" the moment a file the board is drawn from does, and the board redraws
// what that touched -- no reload, no timer. A fetch rather than an EventSource, because only a
// fetch can carry the token header. A dropped stream is picked up again, and a refresh on the way
// back in covers whatever changed while it was down. A refused one is not: the token will not get
// any better, and the refresh puts the reason in the strip.
async function live() {
  try {
    const res = await api("/api/stream");
    refresh();
    if (!res.ok) return;
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    for (let chunk; !(chunk = await reader.read()).done;)
      if (chunk.value.includes("data: changed")) refresh();
  } catch {}
  setTimeout(live, 3000);
}

async function move(id, to, status) {

async function doNow(id) {
  // Shown at once: the switch takes until the running card's next step, and a click that shows
  // nothing for that long reads as a click that did nothing. The next snapshot is the truth.
  for (const t of state.tasks) t.now = t.id === id;
  for (const r of state.system?.running || []) {
    const on = state.tasks.find(t => t.id === r.id);
    if (on && on.id !== id) on.aside = true;
  }
  render();
  const res = await api("/api/now", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id }),
  });
  if (!res.ok) { alert((await res.json()).error); return; }
  refresh();
}

// Dragging a planning or to-do card to a new place in its own column is an order, not a move:
// the card stays where it is, and the column's order is what the daemon and `rfa work` pick from.
let dragging = null;
document.getElementById("board").addEventListener("dragstart", e => {
  const wrap = e.target.closest(".card-wrap[draggable]");
  if (!wrap) return;
  dragging = wrap.dataset.dragId;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragging);
});
document.getElementById("board").addEventListener("dragover", e => {
  const t = dragging && state.tasks.find(x => x.id === dragging);
  const column = e.target.closest(".column");
  if (t && column && column.dataset.stage === t.stage) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; }
});
document.getElementById("board").addEventListener("drop", e => {
  if (!dragging) return;
  const t = state.tasks.find(x => x.id === dragging);
  const column = e.target.closest(".column");
  if (!t || !column || column.dataset.stage !== t.stage) return;
  e.preventDefault();
  const id = dragging;
  dragging = null;
  const cards = [...column.querySelectorAll(".card-wrap[draggable]")].filter(w => w.dataset.dragId !== id);
  let index = cards.length;
  for (let i = 0; i < cards.length; i++) {
    const box = cards[i].getBoundingClientRect();
    if (e.clientY < box.top + box.height / 2) { index = i; break; }
  }
  reorder(id, index);
});
document.getElementById("board").addEventListener("click", e => {
  const head = e.target.closest("button[data-group]");
  if (head) {
    collapsed[head.dataset.group] = head.getAttribute("aria-expanded") === "true";
    try { localStorage.setItem("rfa-collapsed", JSON.stringify(collapsed)); } catch {}
    return render();
  }
  const el = e.target.closest(".card");
  if (el) showDetail(el.dataset.id);
});
document.getElementById("d-actions").addEventListener("click", e => {
  if (e.target.closest("#next")) {
    menuOpen = !menuOpen;
    return e.target.closest(".menu").classList.toggle("open", menuOpen);
  }
  if (e.target.closest("#logs")) {
    logsOpen = !logsOpen;
    logOf = logFor(state.tasks.find(x => x.id === openId));
    watching = logsOpen ? openId : null;
    return showDetail(openId);
  }
  if (e.target.closest("#fix") && openId) return fixComments(openId);
  if (e.target.closest("#retry") && openId) return retry(openId);
  if (e.target.closest("#retest") && openId) return retest(openId);
  if (e.target.closest("#rereview") && openId) return rereview(openId);
  if (e.target.closest("#overrule") && openId) return overrule(openId);
  if (e.target.closest("#save")) return saveIdea();
  if (e.target.closest("#cancel-draft")) { const id = drafting; drafting = null; return showDetail(id); }
  if (e.target.closest("#edit-draft")) return showCapture(state.tasks.find(x => x.id === openId));
  const verdict = e.target.closest("button[data-verdict]");
  if (verdict && openId) return setVerdict(openId, verdict.dataset.verdict);
  const held = e.target.closest("button[data-pause]");
  if (held && openId) return setPaused(openId, held.dataset.pause === "1", held.dataset.fresh === "1");
  if (e.target.closest("#now") && openId) return doNow(openId);
  const arch = e.target.closest("button[data-archive]");
  if (arch) return toggleArchive(arch.dataset.archive);
  const prBtn = e.target.closest("button[data-pr]");
  if (prBtn) return createPR(prBtn.dataset.pr);
  if (e.target.closest("#edit")) { editing = true; return showDetail(openId); }
  if (e.target.closest("#save-edit")) return saveEdit();
  if (e.target.closest("#cancel-edit")) { editing = false; return showDetail(openId); }
  const el = e.target.closest("button[data-to]");
  if (el && openId) move(openId, el.dataset.to, el.dataset.status);
});
