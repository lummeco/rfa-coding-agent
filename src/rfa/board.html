document.getElementById("views").addEventListener("click", e => {
  const pick = e.target.closest("button[data-view]");
  if (pick) setView(pick.dataset.view);
});
document.getElementById("home").addEventListener("click", e => {
  const pick = e.target.closest("button[data-view]");
  if (pick) return setView(pick.dataset.view);
  const looking = e.target.closest("button[data-focus]");
  if (looking) { focus = looking.dataset.focus; return home(); }
  const repo = e.target.closest("button[data-analyze]");
  if (repo) { repo.disabled = true; return analyze(repo.dataset.analyze); }
  const act = e.target.closest("button[data-act]");
  if (act) return act.dataset.act === "pause" ? setPaused(act.dataset.actId, true) : toggleArchive(act.dataset.actId);
  // In the line, a place; out of it, none.
  const line = e.target.closest("button[data-line]");
  if (line) return lineUp(line.dataset.line, line.dataset.to === "" ? null : Number(line.dataset.to));
  const el = e.target.closest("[data-id]");
  if (el) showDetail(el.dataset.id);
});
// A card dragged onto the desk: on the top zone it starts now and the current run steps aside; on a
// row of your line it takes that row's place; on the bottom zone it goes to the end.
let carrying = null;
document.getElementById("home").addEventListener("dragstart", e => {
  if (!(carrying = e.target.closest("[data-drag]")?.dataset.drag)) return;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", carrying);
  document.getElementById("home").classList.add("dragging");
});
document.getElementById("home").addEventListener("dragend", () => {
  carrying = null;
  document.getElementById("home").classList.remove("dragging");
});
document.getElementById("home").addEventListener("dragover", e => {
  if (carrying && e.target.closest(".zone, .upnext li")) e.preventDefault();
});
document.getElementById("home").addEventListener("drop", e => {
  const zone = e.target.closest(".zone"), row = e.target.closest(".upnext li");
  if (!carrying || !(zone || row)) return;
  e.preventDefault();
  const id = carrying;
  document.getElementById("home").classList.remove("dragging");
  carrying = null;
  return zone?.dataset.zone === "now" ? doNow(id) : lineUp(id, row ? Number(row.dataset.at) : 9999);
});
document.getElementById("analytics").addEventListener("click", showAnalytics);
document.getElementById("d-body").addEventListener("click", e => {
  const opening = e.target.closest("a[data-open]");
  if (opening) { e.preventDefault(); return showDetail(opening.dataset.open); }
  if (e.target.closest("[data-tests]")) { testCode = false; return showDetail(openId); }
  if (e.target.closest("#logs-back")) { logsOpen = false; watching = null; return showDetail(openId); }
  const log = e.target.closest("button[data-log]");
  if (log) { logOf = log.dataset.log; return showDetail(openId); }
  const t = state.tasks.find(x => x.id === openId);
  const diff = e.target.closest("button[data-diff]");
  if (diff && t) return toggleDiff(t, Number(diff.dataset.diff));
  const pr = e.target.closest("button[data-pr]");
  if (pr) return createPR(pr.dataset.pr);
  const gone = e.target.closest("button[data-uncomment]");
  if (gone) return deleteComment(gone.dataset.uncomment);
  if (e.target.closest("#comment-save")) return saveComment();
  if (e.target.closest("#comment-cancel")) return closeCommentForm();
  const whole = e.target.closest("#comment-round");
  if (whole) return openRoundCommentForm(whole);
  // A click on a line, not a drag to select some of it: selecting code to copy is not a comment.
  const line = e.target.closest("tr.commentable");
  if (line && !String(getSelection()).trim()) return openCommentForm(line);
  const jump = e.target.closest(".ftree [data-goto]");
  if (jump) return goto(jump.closest(".diffbox"), jump.dataset.goto);
  const header = e.target.closest(".diffbox .d2h-file-header");
  if (header && !e.target.closest("a") && !String(getSelection()).trim()) return fold(header.closest(".d2h-file-wrapper"));
  const pick = e.target.closest("button[data-tab]");
  if (pick) {
    tab = pick.dataset.tab;
    return showDetail(openId);
  }
  const answer = e.target.closest("button[data-answer]");
  if (answer) return answerQuestion(Number(answer.dataset.answer));
  const peDel = e.target.closest("button[data-pe-del]");
  if (peDel) { peDel.closest("li").remove(); return; }
  const peAdd = e.target.closest("button[data-pe-add]");
  if (peAdd) {
    const field = peAdd.dataset.peAdd;
    const li = document.createElement("li");
    li.innerHTML = `<textarea rows="1"></textarea><button class="pe-del" data-pe-del="${field}" title="Remove this item">✕</button>`;
    document.getElementById(`pe-list-${field}`).appendChild(li);
    li.querySelector("textarea").focus();
    return;
  }
  // The command is read off the page rather than out of the button, so what you copy is what you see.
  // Selected as well as written: the clipboard API is only there on a secure origin, and a board
  // served to anything but localhost should still let you press ⌘C rather than quietly do nothing.
  const copy = e.target.closest("button[data-copy]");
  if (copy) {
    getSelection().selectAllChildren(copy.previousElementSibling);
    navigator.clipboard?.writeText(copy.previousElementSibling.textContent);
    copy.textContent = navigator.clipboard ? "Copied" : "⌘C";
    setTimeout(() => copy.textContent = "Copy", 1200);
    return;
  }
  if (e.target.closest("button[data-drop]")) {
    const [repo, branch] = e.target.closest("button[data-drop]").dataset.drop.split(/@(.*)/s);
    refs = refs.filter(r => !(r.repo === repo && r.branch === branch));
    return drawCapture();
  }
  const chip = e.target.closest("button[data-repo]");
  if (!chip) return;
  const repo = chip.dataset.repo;
  picked.has(repo) ? picked.delete(repo) : picked.add(repo);
  delete start[repo];
  refs = refs.filter(r => picked.has(r.repo));
  loadBranches();
});

// The two branch selects: one says where the work starts, the other adds something to read.
document.getElementById("d-body").addEventListener("change", e => {
  if (e.target.id === "window") { windowChoice = e.target.value; return drawAnalytics(); }
  const from = e.target.closest("select[data-start]");
  if (from) {
    const repo = from.dataset.start;
    start[repo] = from.value;
    refs = refs.filter(r => !(r.repo === repo && r.branch === from.value));
    return drawCapture();
  }
  const also = e.target.closest("select[data-ref]");
  if (!also || !also.value) return;
  if (refs.length >= MAX_REF) { also.value = ""; return; }
  refs.push({ repo: also.dataset.ref, branch: also.value });
  drawCapture();
});
document.getElementById("close").addEventListener("click", closeDetail);
document.getElementById("d-side").addEventListener("click", e => {
  if (e.target.closest("[data-tests]")) { testCode = true; return showDetail(openId); }
  const el = e.target.closest("[data-id], a[data-open]");
  if (!el) return;
  e.preventDefault();
  tab = "runs";
  showDetail(el.dataset.id || el.dataset.open);
});
document.getElementById("scrim").addEventListener("click", closeDetail);
document.addEventListener("keydown", e => {
  if (commentAt && e.target.id === "comment-text") {
    if (e.key === "Escape") return closeCommentForm();
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") return saveComment();
    return;
  }
  if (e.target.matches(".oq textarea") && (e.metaKey || e.ctrlKey) && e.key === "Enter") return answerQuestion(Number(e.target.dataset.oq));
  if (e.key === "Escape" && menuOpen) { menuOpen = false; return document.querySelector(".menu")?.classList.remove("open"); }
  if (e.key === "Escape") return closeDetail();
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && document.getElementById("idea")) return saveIdea();
  if (e.target.matches("textarea, input")) return;  // typing an idea, not pressing a shortcut
  if (e.key.toLowerCase() === "n") { e.preventDefault(); showCapture(); }
  if (e.key.toLowerCase() === "r" && !e.metaKey && !e.ctrlKey) refresh();
  if (e.key.toLowerCase() === "v" && !e.metaKey && !e.ctrlKey) setView(view === "home" ? "board" : "home");
});

live();
// Faster than the board, because this is the one thing you sit and watch -- and only while there is
// something to watch: a finished run is read once, when the panel opens.
setInterval(() => watching && LIVE.has(state.tasks.find(t => t.id === watching)?.status) && drawRun(watching), 1500);
</script>
</body>
